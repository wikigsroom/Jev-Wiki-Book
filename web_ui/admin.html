<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>JEV · 资料管理</title><link rel="stylesheet" href="/ui/site.css"><script src="/ui/admin.js" defer></script></head>
<body><header class="mast"><a class="brand" href="/">JEV<span>资料管理</span></a><div class="actions" id="account" hidden><span class="status">管理员</span><button class="quiet" id="show-password">修改密码</button><button class="quiet" id="logout">退出登录</button></div></header>
<main class="admin-main"><div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
<section class="panel login-panel" id="login-panel"><span class="eyebrow">管理可供查询的资料</span><h1>管理员登录</h1><form id="login-form"><label for="username">用户名</label><input id="username" autocomplete="username" value="admin" required><label for="password">密码</label><input id="password" type="password" autocomplete="current-password" required maxlength="256"><button type="submit">登录管理端</button></form><p class="help">首次登录凭据见部署说明。登录后需设置新密码。</p></section>
<section class="panel login-panel" id="password-panel" hidden><h2>设置管理员密码</h2><p class="help" id="password-help">新密码至少 12 个字符。修改后，其他已登录会话会退出。</p><form id="password-form"><label for="current-password">当前密码</label><input id="current-password" type="password" autocomplete="current-password" required maxlength="256"><label for="new-password">新密码</label><input id="new-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><label for="confirm-password">再次输入新密码</label><input id="confirm-password" type="password" autocomplete="new-password" minlength="12" maxlength="256" required><div class="actions"><button type="submit">保存新密码</button><button type="button" class="secondary" id="cancel-password">取消</button></div></form></section>
<div id="dashboard" hidden><div class="row"><div><span class="eyebrow">控制查询范围</span><h1>开放哪些资料？</h1></div><span class="status" id="model-status"></span></div><div class="admin-grid">
<aside><section class="panel"><h2>建立文档库</h2><p class="help">输入此服务器上的文件夹路径。扫描完成后，在右侧选择允许查询的文档。</p><form id="scan-form"><label for="source">服务器文件夹路径</label><input id="source" placeholder="例如 D:\资料 或 /srv/documents" autocomplete="off" required><button type="submit" id="scan">扫描目录</button></form><div id="job" hidden><p class="help" id="job-message"></p><progress id="job-progress" value="0" max="1"></progress><button id="cancel-job" class="quiet" type="button">取消扫描</button></div></section>
<section class="panel"><h2>查询端</h2><p class="mono help" id="web-address"></p><p class="help">查询端只显示问题与命中段落，不显示服务器目录，也不能修改资料。</p><p class="help">保存访问范围后立即生效。新扫描的文档需重新选择并开放。</p></section></aside>
<section class="panel"><div class="row"><h2>可访问文档</h2><button class="quiet" id="refresh">刷新列表</button></div><p class="help" id="publication-state">尚未开放资料</p><div id="libraries"></div><div class="actions"><button id="publish">保存访问范围</button><button id="unpublish" class="secondary">关闭全部资料访问</button></div></section></div></div>
<footer>JEV · 资料由管理员开放，查询结果来自原文。</footer></main></body></html>
